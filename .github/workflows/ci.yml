name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install ./tui
      - name: Run unit tests
        run: PYTHONPATH=tui python -m unittest discover -s tui/tests -v
      - name: Check shell syntax
        run: |
          sh -n anme-cli
          sh -n install.sh
          sh -n tui/install.sh
      - name: Verify executable files
        run: test -x anme-cli && test -x install.sh && test -x tui/install.sh
